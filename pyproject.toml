[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheapclaw"
version = "0.3.0"
description = "Terminal client for web model frontends powered by Playwright."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "pydantic>=2.0",
    "rich>=13.0",
    "Pygments>=2.15",
    "jieba>=0.42",
]

[project.scripts]
cheapclaw = "cheapclaw.cli:main"
cheapclaw-export-state = "cheapclaw.scripts.export_state:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cheapclaw*"]
exclude = ["tests*", "build*", "debug*", "plans*", "config*"]

[tool.setuptools.package-data]
"cheapclaw.agent_core" = ["prompts/*.md"]
"cheapclaw.model_clients.qwen" = ["scripts/*.js", "selectors.yaml"]
"cheapclaw.model_clients.deepseek" = ["scripts/*.js", "selectors.yaml"]
"cheapclaw.config" = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"

[tool.isort]
profile = "black"
