[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheapclaw"
version = "0.1.0"
description = "Terminal client for web model frontends powered by Playwright."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "pydantic>=2.0",
    "rich>=13.0",
    "Pygments>=2.15",
]

[project.scripts]
cheapclaw = "run:main"
cheapclaw-export-state = "scripts.export_state:main"

[tool.setuptools]
py-modules = ["run"]
packages = [
    "agent_core",
    "model_clients",
    "model_clients.qwen",
    "model_clients.deepseek",
    "ui",
    "utils",
    "scripts",
]
include-package-data = true

[tool.setuptools.package-data]
agent_core = ["prompts/*.md"]
"model_clients.qwen" = ["scripts/*.js", "selectors.yaml"]
"model_clients.deepseek" = ["scripts/*.js", "selectors.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"

[tool.isort]
profile = "black"
